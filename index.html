<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentification</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>
    <h1 class="text-center display-1 fw-bold">Authentification</h1>

    <div id="form" class="d-flex flex-column gap-3">
        <div class="form-floating mb-3 mx-auto w-75">
            <input type="text" class="form-control w-100 border-dark " id="floatingInput" placeholder="Ex: Jonh Doe">
            <label for="floatingInput">Nom complet</label>
        </div>
        <div class="form-floating mx-auto w-75">
            <input type="password" class="form-control w-100 border-dark " id="floatingPassword" placeholder="Password">
            <label for="floatingPassword">Password</label>
        </div>
        <a href="#" class="btn btn-primary mx-auto" id="button">Terminer</a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"
        defer></script>
    <script src="./script.js"></script>
</body>

</html>
